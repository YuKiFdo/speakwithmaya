services:
  maya-landing:
    image: ${LANDING_IMAGE:-ghcr.io/yukifdo/speakwithmaya-landing:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maya-landing
    # Low CPU priority: static pages can wait a few ms, live calls cannot
    cpu_shares: 256
    restart: unless-stopped
    network_mode: "host"
    environment:
      - NODE_ENV=production
      - PORT=3001
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
