# ==============================================================================
# Maya AI - Nginx Reverse Proxy Configuration for OVHcloud Backup Server
# Place in: /etc/nginx/sites-available/speakwithmaya
# Symlink to: /etc/nginx/sites-enabled/speakwithmaya
# ==============================================================================

# 1. Landing Page: speakwithmaya.com & www.speakwithmaya.com -> Next.js (port 3001)
server {
    listen 80;
    server_name speakwithmaya.com www.speakwithmaya.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Universal Web Client: app.speakwithmaya.com -> Expo Web Server (port 8080)
server {
    listen 80;
    server_name app.speakwithmaya.com;

    client_max_body_size 50M;

    # Fast health check directly from Nginx or proxy to Node server
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Backend API & Gemini Live WebSockets: api.speakwithmaya.com -> NestJS (port 3000)
server {
    listen 80;
    server_name api.speakwithmaya.com;

    client_max_body_size 50M;

    # Live Session WebSockets (audio streaming & voice chat)
    location /live-session {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Standard REST API endpoints
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

