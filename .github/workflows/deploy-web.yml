name: Deploy Web to Azure Static Web Apps

on:
  push:
    branches: [main, master]
    paths:
      - 'maya-frontend/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  build_and_deploy_web:
    runs-on: ubuntu-latest
    name: Build and Deploy Expo Web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'maya-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./maya-frontend
        run: npm ci

      - name: Build & Export Expo Static Web
        working-directory: ./maya-frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'maya-frontend/dist'
          output_location: ''
          skip_app_build: true
