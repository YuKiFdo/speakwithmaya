name: Deploy Web to Azure App Service

on:
  push:
    branches: [main, master]
    paths:
      - 'maya-frontend/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  build_and_deploy_web:
    runs-on: ubuntu-latest
    name: Build and Deploy Expo Web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'maya-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./maya-frontend
        run: npm ci

      - name: Build & Export Expo Static Web
        working-directory: ./maya-frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL || 'https://maya-backend.icyisland-5baf2c26.southeastasia.azurecontainerapps.io' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://clfjfhdsjwkzgxwoolgp.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_gQOKzy0Kf5Mw9Uc4wdCdIA_WaLKtaip' }}
        run: npx expo export --platform web

      - name: Package web bundle with server
        working-directory: ./maya-frontend
        run: |
          cd dist
          zip -r ../deploy.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'maya-ai'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './maya-frontend/deploy.zip'
