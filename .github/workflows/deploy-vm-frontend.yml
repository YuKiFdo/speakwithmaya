name: Deploy Frontend to Ubuntu VM (Production)

on:
  push:
    branches: [production]
    paths:
      - 'maya-frontend/**'
      - '.github/workflows/deploy-vm-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Frontend (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Ensure deployment to backup proceeds even if primary is offline
      matrix:
        target:
          - id: azure
            name: 'Azure Primary'
          - id: ovh
            name: 'OVH Backup'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'maya-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./maya-frontend
        run: npm ci

      - name: Export Expo Static Web
        working-directory: ./maya-frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL || 'https://api.speakwithmaya.com' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL || 'https://sjhvhjxbkpidrjbpiqfw.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PROD_SUPABASE_ANON_KEY || 'sb_publishable_usiFVN4cjSUgfKokGGBgyw_FFjWHg5f' }}
          EXPO_PUBLIC_USE_SERVER_LIVE: 'true'
        run: |
          npx expo export --platform web
          node ./scripts/precompress-dist.js

      - name: Deploy to ${{ matrix.target.name }}
        env:
          TARGET_ID: ${{ matrix.target.id }}
          VM_IP: ${{ matrix.target.id == 'azure' && (secrets.VM_IP || '20.198.240.185') || (secrets.BACKUP_VM_IP || '139.99.192.179') }}
          VM_USER: ${{ matrix.target.id == 'azure' && (secrets.VM_USER || 'speakwithmaya') || (secrets.BACKUP_VM_USER || 'ubuntu') }}
          SSH_KEY: ${{ matrix.target.id == 'azure' && secrets.VM_SSH_KEY || (secrets.BACKUP_VM_SSH_KEY || '') }}
          VM_PASSWORD: ${{ matrix.target.id == 'ovh' && secrets.BACKUP_VM_PASSWORD || '' }}
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts

          USE_SSHPASS=false
          if [ -n "$VM_PASSWORD" ]; then
            sudo apt-get update && sudo apt-get install -y sshpass
            USE_SSHPASS=true
          elif [ -n "$SSH_KEY" ]; then
            echo "$SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          else
            echo "ERROR: Neither SSH_KEY nor VM_PASSWORD provided for $TARGET_ID"
            exit 1
          fi

          ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

          run_ssh() {
            if [ "$USE_SSHPASS" = true ]; then
              sshpass -p "$VM_PASSWORD" ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no "$VM_USER@$VM_IP" "$@"
            else
              ssh -o StrictHostKeyChecking=no "$VM_USER@$VM_IP" "$@"
            fi
          }

          run_rsync() {
            if [ "$USE_SSHPASS" = true ]; then
              rsync -avz -e "sshpass -p '$VM_PASSWORD' ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no" "$@"
            else
              rsync -avz -e "ssh -o StrictHostKeyChecking=no" "$@"
            fi
          }

          # Ensure app directories exist
          run_ssh "mkdir -p /home/$VM_USER/apps/maya-frontend/dist /home/$VM_USER/apps/maya-frontend/web-server"

          # Sync exported dist directory while preserving hashed _expo/static & assets from recent deploys
          # so in-flight tabs never hit 404 on old bundle hashes, then prune bundles older than 7 days.
          run_rsync --delete --exclude='_expo/' --exclude='assets/' ./maya-frontend/dist/ "$VM_USER@$VM_IP:/home/$VM_USER/apps/maya-frontend/dist/"
          run_rsync ./maya-frontend/dist/_expo/ "$VM_USER@$VM_IP:/home/$VM_USER/apps/maya-frontend/dist/_expo/"
          run_rsync ./maya-frontend/dist/assets/ "$VM_USER@$VM_IP:/home/$VM_USER/apps/maya-frontend/dist/assets/"
          run_ssh "find /home/$VM_USER/apps/maya-frontend/dist/_expo /home/$VM_USER/apps/maya-frontend/dist/assets -type f -mtime +7 -delete 2>/dev/null || true"
          run_rsync --delete ./maya-frontend/web-server/ "$VM_USER@$VM_IP:/home/$VM_USER/apps/maya-frontend/web-server/"
          run_rsync ./maya-frontend/ecosystem.config.cjs "$VM_USER@$VM_IP:/home/$VM_USER/apps/maya-frontend/"

          # Start or reload PM2 process
          run_ssh "bash -l -c '
            cd /home/$VM_USER/apps/maya-frontend
            # Graceful reload (wait_ready): old process serves until the new one is listening
            pm2 startOrReload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs --update-env
            pm2 save
          '"
