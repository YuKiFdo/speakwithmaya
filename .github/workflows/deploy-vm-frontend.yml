name: Deploy Frontend to Ubuntu VM (Production)

on:
  push:
    branches: [production]
    paths:
      - 'maya-frontend/**'
      - '.github/workflows/deploy-vm-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'maya-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./maya-frontend
        run: npm ci

      - name: Export Expo Static Web
        working-directory: ./maya-frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL || 'https://api.speakwithmaya.com' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL || 'https://sjhvhjxbkpidrjbpiqfw.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PROD_SUPABASE_ANON_KEY || 'sb_publishable_usiFVN4cjSUgfKokGGBgyw_FFjWHg5f' }}
          EXPO_PUBLIC_USE_SERVER_LIVE: 'true'
        run: |
          npx expo export --platform web
          node ./scripts/precompress-dist.js

      - name: Deploy to Ubuntu VM
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_IP: ${{ secrets.VM_IP || '20.198.240.185' }}
          VM_USER: ${{ secrets.VM_USER || 'speakwithmaya' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts

          # Ensure app directories exist
          ssh "$VM_USER@$VM_IP" "mkdir -p /home/$VM_USER/apps/maya-frontend/dist /home/$VM_USER/apps/maya-frontend/web-server"

          # Sync exported dist directory while preserving hashed _expo/static & assets from recent deploys
          # so in-flight tabs never hit 404 on old bundle hashes, then prune bundles older than 7 days.
          rsync -avz --delete --exclude='_expo/' --exclude='assets/' ./maya-frontend/dist/ "$VM_USER@$VM_IP:/home/$VM_USER/apps/maya-frontend/dist/"
          rsync -avz ./maya-frontend/dist/_expo/ "$VM_USER@$VM_IP:/home/$VM_USER/apps/maya-frontend/dist/_expo/"
          rsync -avz ./maya-frontend/dist/assets/ "$VM_USER@$VM_IP:/home/$VM_USER/apps/maya-frontend/dist/assets/"
          ssh "$VM_USER@$VM_IP" "find /home/$VM_USER/apps/maya-frontend/dist/_expo /home/$VM_USER/apps/maya-frontend/dist/assets -type f -mtime +7 -delete || true"
          rsync -avz --delete ./maya-frontend/web-server/ "$VM_USER@$VM_IP:/home/$VM_USER/apps/maya-frontend/web-server/"
          rsync -avz ./maya-frontend/ecosystem.config.cjs "$VM_USER@$VM_IP:/home/$VM_USER/apps/maya-frontend/"

          # Recreate PM2 process so it switches cleanly from built-in `pm2 serve` to `./web-server/server.js`
          ssh "$VM_USER@$VM_IP" "bash -l -c '
            cd /home/$VM_USER/apps/maya-frontend
            pm2 delete maya-frontend || true
            pm2 start ecosystem.config.cjs --update-env
            pm2 save
          '"
