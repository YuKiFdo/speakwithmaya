name: Deploy Backend to Ubuntu VM (Production)

on:
  push:
    branches: [production]
    paths:
      - 'maya-backend/**'
      - '.github/workflows/deploy-vm-backend.yml'
  workflow_dispatch:

# One VM deploy at a time across ALL apps: on the 2-vCPU VMs a backend boot (~1 min of
# full CPU) overlapping another deploy starved the backend and took the API down
# (2026-11-18 01:39-01:45 UTC). Runs queue instead of overlapping.
concurrency:
  group: vm-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_sha: ${{ steps.meta.outputs.image_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}-backend"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE}:latest" >> $GITHUB_OUTPUT
          echo "image_sha=${IMAGE}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./maya-backend
          file: ./maya-backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (${{ matrix.target.name }})
    needs: build-and-push
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - id: azure
            name: Azure Primary
          - id: ovh
            name: OVH Backup

    steps:
      - name: Checkout code
        if: matrix.target.id != 'azure' || vars.ENABLE_AZURE_DEPLOY == 'true'
        uses: actions/checkout@v4

      - name: Configure SSH and deploy Docker container
        if: matrix.target.id != 'azure' || vars.ENABLE_AZURE_DEPLOY == 'true'
        env:
          TARGET_ID: ${{ matrix.target.id }}
          VM_IP: ${{ matrix.target.id == 'azure' && (secrets.VM_IP || '20.198.240.185') || (secrets.BACKUP_VM_IP || '139.99.192.179') }}
          VM_USER: ${{ matrix.target.id == 'azure' && (secrets.VM_USER || 'speakwithmaya') || (secrets.BACKUP_VM_USER || 'ubuntu') }}
          SSH_KEY: ${{ matrix.target.id == 'azure' && secrets.VM_SSH_KEY || (secrets.BACKUP_VM_SSH_KEY || '') }}
          VM_PASSWORD: ${{ matrix.target.id == 'ovh' && secrets.BACKUP_VM_PASSWORD || '' }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}

        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts

          USE_SSHPASS=false

          if [ -n "$VM_PASSWORD" ]; then
            sudo apt-get install -y --no-install-recommends sshpass || (sudo apt-get update && sudo apt-get install -y sshpass)
            USE_SSHPASS=true
          elif [ -n "$SSH_KEY" ]; then
            echo "$SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          else
            echo "ERROR: Missing SSH credentials for $TARGET_ID"
            exit 1
          fi

          ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

          run_ssh() {
            if [ "$USE_SSHPASS" = true ]; then
              sshpass -p "$VM_PASSWORD" ssh \
                -o ControlMaster=auto -o ControlPath=/tmp/ssh-mux-%r@%h -o ControlPersist=300 \
                -o StrictHostKeyChecking=no \
                -o PreferredAuthentications=password \
                -o PubkeyAuthentication=no \
                "$VM_USER@$VM_IP" "$@"
            else
              ssh -o ControlMaster=auto -o ControlPath=/tmp/ssh-mux-%r@%h -o ControlPersist=300 -o StrictHostKeyChecking=no \
                "$VM_USER@$VM_IP" "$@"
            fi
          }

          run_rsync() {
            if [ "$USE_SSHPASS" = true ]; then
              rsync -az --stats -e "sshpass -p '$VM_PASSWORD' ssh -o ControlMaster=auto -o ControlPath=/tmp/ssh-mux-%r@%h -o ControlPersist=300 -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no" "$@"
            else
              rsync -az --stats -e "ssh -o ControlMaster=auto -o ControlPath=/tmp/ssh-mux-%r@%h -o ControlPersist=300 -o StrictHostKeyChecking=no" "$@"
            fi
          }

          APP_DIR="/home/$VM_USER/apps/maya-backend"

          echo "Preparing deployment on $TARGET_ID ($VM_IP)..."
          run_ssh "mkdir -p '$APP_DIR/assets/audio-cache'"

          echo "Syncing docker-compose configuration..."
          run_rsync ./maya-backend/docker-compose.yml "$VM_USER@$VM_IP:$APP_DIR/docker-compose.yml"

          echo "Pulling Docker image and launching container..."
          run_ssh "bash -l -c '
            set -e
            APP_DIR=\"$APP_DIR\"
            cd \"\$APP_DIR\"

            # Authenticate Docker against ghcr.io using temporary GitHub Actions token
            echo \"$REGISTRY_PASSWORD\" | docker login ghcr.io -u \"$REGISTRY_USER\" --password-stdin

            # Pull the new image BEFORE touching the running app, so a failed pull leaves it serving
            export BACKEND_IMAGE=\"$IMAGE_TAG\"
            docker compose pull maya-backend

            # One-time migration: remove the legacy host PM2 process that holds port 3000
            if command -v pm2 >/dev/null 2>&1 && pm2 describe maya-backend >/dev/null 2>&1; then
              pm2 delete maya-backend
              pm2 save --force
            fi

            # Recreate the container on the new image (brief restart; old one is stopped first)
            docker compose up -d --remove-orphans maya-backend

            # Wait for the healthcheck (boot takes ~1 min on the 2-vCPU VMs); fail the job if it never gets healthy
            for i in \$(seq 1 60); do
              STATUS=\$(docker inspect -f \"{{.State.Health.Status}}\" maya-backend 2>/dev/null || echo missing)
              [ \"\$STATUS\" = healthy ] && break
              [ \"\$STATUS\" = unhealthy ] && { docker logs --tail 100 maya-backend; exit 1; }
              sleep 5
            done
            [ \"\$STATUS\" = healthy ] || { echo \"Backend not healthy after 5 min\"; docker logs --tail 100 maya-backend; exit 1; }

            # Remove dangling images to keep the disk clean
            docker image prune -f

            echo \"Backend Docker container successfully running:\"
            docker compose ps maya-backend
          '"
