name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [main, master]
    paths:
      - 'maya-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ca80cba74f9aacr.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./maya-backend
          file: ./maya-backend/Dockerfile
          push: true
          tags: |
            ca80cba74f9aacr.azurecr.io/maya-backend:latest
            ca80cba74f9aacr.azurecr.io/maya-backend:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ca80cba74f9aacr
          acrUsername: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          acrPassword: ${{ secrets.AZURE_REGISTRY_PASSWORD }}
          containerAppName: maya-backend
          resourceGroup: maya-ai_group
          containerAppEnvironment: maya-backend-env
          imageToDeploy: ca80cba74f9aacr.azurecr.io/maya-backend:${{ github.sha }}
          targetPort: 3000
          ingress: external
