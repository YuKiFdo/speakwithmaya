name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [main, master]
    paths:
      - 'maya-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/maya-backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./maya-backend
          file: ./maya-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/maya-backend
          imageToDeploy: ghcr.io/${{ github.repository }}/maya-backend:latest
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME || 'app-maya-backend' }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-maya-ai' }}
          containerAppEnvironment: ${{ vars.AZURE_CONTAINER_APP_ENV || 'env-maya-ai' }}
          targetPort: 3000
          ingress: external
