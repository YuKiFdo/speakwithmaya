name: Deploy Landing to Ubuntu VM (Production)

on:
  push:
    branches: [production]
    paths:
      - 'maya-landing/**'
      - '.github/workflows/deploy-vm-landing.yml'
  workflow_dispatch:

concurrency:
  group: vm-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Landing Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_sha: ${{ steps.meta.outputs.image_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}-landing"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE}:latest" >> $GITHUB_OUTPUT
          echo "image_sha=${IMAGE}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Landing Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./maya-landing
          file: ./maya-landing/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Landing (${{ matrix.target.name }})
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: azure
            name: 'Azure Primary'
          - id: leaseweb
            name: 'Leaseweb Production'

    steps:
      - name: Checkout code
        if: matrix.target.id != 'azure' || vars.ENABLE_AZURE_DEPLOY == 'true'
        uses: actions/checkout@v4

      - name: Deploy Landing to ${{ matrix.target.name }}
        if: matrix.target.id != 'azure' || vars.ENABLE_AZURE_DEPLOY == 'true'
        env:
          TARGET_ID: ${{ matrix.target.id }}
          VM_IP: ${{ matrix.target.id == 'azure' && (secrets.VM_IP || '20.198.240.185') || (secrets.BACKUP_VM_IP || '172.255.209.238') }}
          VM_USER: ${{ matrix.target.id == 'azure' && (secrets.VM_USER || 'speakwithmaya') || (secrets.BACKUP_VM_USER || 'speakwithmaya') }}
          SSH_KEY: ${{ matrix.target.id == 'azure' && secrets.VM_SSH_KEY || (secrets.BACKUP_VM_SSH_KEY || '') }}
          VM_PASSWORD: ${{ matrix.target.id == 'leaseweb' && secrets.BACKUP_VM_PASSWORD || '' }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}

        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts

          USE_SSHPASS=false
          if [ -n "$VM_PASSWORD" ]; then
            sudo apt-get install -y --no-install-recommends sshpass || (sudo apt-get update && sudo apt-get install -y sshpass)
            USE_SSHPASS=true
          elif [ -n "$SSH_KEY" ]; then
            echo "$SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          else
            echo "ERROR: Neither SSH_KEY nor VM_PASSWORD provided for $TARGET_ID"
            exit 1
          fi

          ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

          run_ssh() {
            if [ "$USE_SSHPASS" = true ]; then
              sshpass -p "$VM_PASSWORD" ssh -o ControlMaster=auto -o ControlPath=/tmp/ssh-mux-%r@%h -o ControlPersist=300 -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no "$VM_USER@$VM_IP" "$@"
            else
              ssh -o ControlMaster=auto -o ControlPath=/tmp/ssh-mux-%r@%h -o ControlPersist=300 -o StrictHostKeyChecking=no "$VM_USER@$VM_IP" "$@"
            fi
          }

          run_rsync() {
            if [ "$USE_SSHPASS" = true ]; then
              rsync -az --stats -e "sshpass -p '$VM_PASSWORD' ssh -o ControlMaster=auto -o ControlPath=/tmp/ssh-mux-%r@%h -o ControlPersist=300 -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no" "$@"
            else
              rsync -az --stats -e "ssh -o ControlMaster=auto -o ControlPath=/tmp/ssh-mux-%r@%h -o ControlPersist=300 -o StrictHostKeyChecking=no" "$@"
            fi
          }

          APP_DIR="/home/$VM_USER/apps/maya-landing"

          echo "Preparing deployment on $TARGET_ID ($VM_IP)..."
          run_ssh "mkdir -p '$APP_DIR'"

          echo "Syncing docker-compose configuration..."
          run_rsync ./maya-landing/docker-compose.yml "$VM_USER@$VM_IP:$APP_DIR/docker-compose.yml"

          echo "Pulling Landing Docker image and launching container..."
          run_ssh "bash -l -c '
            set -e
            APP_DIR=\"$APP_DIR\"
            cd \"\$APP_DIR\"

            # Authenticate Docker against ghcr.io using temporary GitHub Actions token
            echo \"$REGISTRY_PASSWORD\" | docker login ghcr.io -u \"$REGISTRY_USER\" --password-stdin

            # Pull the new image BEFORE touching the running app, so a failed pull leaves it serving
            export LANDING_IMAGE=\"$IMAGE_TAG\"
            # Retry the pull: GHCR downloads over the VPS IPv6 route sometimes get connection reset by peer
            for attempt in 1 2 3 4; do
              # timeout: unpacking layers on the CPU-starved VPS can take 5+ min; a truly stuck pull still fails after 20 min
              if timeout 1200 docker compose pull --quiet maya-landing; then break; fi
              if [ \"\$attempt\" = 4 ]; then echo \"Image pull failed after 4 attempts\"; exit 1; fi
              echo \"Image pull failed (attempt \$attempt), retrying in \$((attempt * 10))s...\"
              sleep \$((attempt * 10))
            done

            # One-time migration: remove the legacy host PM2 process that holds port 3001
            if command -v pm2 >/dev/null 2>&1 && pm2 describe maya-landing >/dev/null 2>&1; then
              pm2 delete maya-landing
              pm2 save --force
            fi

            # Recreate the container on the new image (brief restart; old one is stopped first)
            docker compose up -d --remove-orphans maya-landing

            # Remove dangling images to keep the disk clean
            docker image prune -f

            echo \"Landing Docker container successfully running:\"
            docker compose ps maya-landing
          '"
