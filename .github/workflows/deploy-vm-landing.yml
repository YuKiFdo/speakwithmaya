name: Deploy Landing to Ubuntu VM (Production)

on:
  push:
    branches: [production]
    paths:
      - 'maya-landing/**'
      - '.github/workflows/deploy-vm-landing.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Landing (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Ensure deployment to backup proceeds even if primary is offline
      matrix:
        target:
          - id: azure
            name: 'Azure Primary'
          - id: ovh
            name: 'OVH Backup'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'maya-landing/package-lock.json'

      - name: Install dependencies & Build
        working-directory: ./maya-landing
        run: |
          npm ci
          npm run build

      - name: Deploy to ${{ matrix.target.name }}
        env:
          TARGET_ID: ${{ matrix.target.id }}
          VM_IP: ${{ matrix.target.id == 'azure' && (secrets.VM_IP || '20.198.240.185') || (secrets.BACKUP_VM_IP || '139.99.192.179') }}
          VM_USER: ${{ matrix.target.id == 'azure' && (secrets.VM_USER || 'speakwithmaya') || (secrets.BACKUP_VM_USER || 'ubuntu') }}
          SSH_KEY: ${{ matrix.target.id == 'azure' && secrets.VM_SSH_KEY || (secrets.BACKUP_VM_SSH_KEY || '') }}
          VM_PASSWORD: ${{ matrix.target.id == 'ovh' && secrets.BACKUP_VM_PASSWORD || '' }}
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts

          USE_SSHPASS=false
          if [ -n "$VM_PASSWORD" ]; then
            sudo apt-get update && sudo apt-get install -y sshpass
            USE_SSHPASS=true
          elif [ -n "$SSH_KEY" ]; then
            echo "$SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          else
            echo "ERROR: Neither SSH_KEY nor VM_PASSWORD provided for $TARGET_ID"
            exit 1
          fi

          ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

          run_ssh() {
            if [ "$USE_SSHPASS" = true ]; then
              sshpass -p "$VM_PASSWORD" ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no "$VM_USER@$VM_IP" "$@"
            else
              ssh -o StrictHostKeyChecking=no "$VM_USER@$VM_IP" "$@"
            fi
          }

          run_rsync() {
            if [ "$USE_SSHPASS" = true ]; then
              rsync -avz --delete -e "sshpass -p '$VM_PASSWORD' ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no" "$@"
            else
              rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" "$@"
            fi
          }

          # Ensure app directory exists
          run_ssh "mkdir -p /home/$VM_USER/apps/maya-landing"

          # Sync landing files to VM
          run_rsync \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next/cache' \
            ./maya-landing/ "$VM_USER@$VM_IP:/home/$VM_USER/apps/maya-landing/"

          # Install production dependencies and start/restart PM2
          run_ssh "bash -l -c '
            cd /home/$VM_USER/apps/maya-landing
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs --update-env
            pm2 save
          '"
