services:
  maya-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/yukifdo/speakwithmaya-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maya-backend
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 3
    network_mode: "host"
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./assets/audio-cache:/app/assets/audio-cache
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
