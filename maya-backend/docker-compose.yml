services:
  maya-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/yukifdo/speakwithmaya-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maya-backend
    # Live calls get CPU first when the 2 vCPUs are contended (relative weight; no effect when idle)
    cpu_shares: 2048
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      # bash /dev/tcp instead of spawning node: a node process per check cost ~0.7s CPU
      # and timed out under load on the 2-vCPU VM, flagging a working backend unhealthy.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /v1/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    network_mode: "host"
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./assets/audio-cache:/app/assets/audio-cache
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
